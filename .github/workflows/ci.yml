name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings=0
      - name: jest
        run: |
          set +e
          npx jest --ci --verbose 2>&1 | tee /tmp/jest.log
          EXIT=${PIPESTATUS[0]}
          cat /tmp/jest.log
          if [ $EXIT -ne 0 ]; then
            echo "::error::jest failed — $(head -n 30 /tmp/jest.log | tr '\n' ';' | cut -c1-800)"
          fi
          exit $EXIT
