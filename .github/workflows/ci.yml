name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings=0
      - name: jest
        run: npx jest --ci --verbose 2>&1 | tee /tmp/jest.log; test ${PIPESTATUS[0]} -eq 0
      - if: failure()
        run: |
          cp /tmp/jest.log ./jest-ci-failure.log || echo "no log" > ./jest-ci-failure.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@trailcast"
          git add jest-ci-failure.log || true
          git commit -m "ci: jest log" || true
          git push || true
