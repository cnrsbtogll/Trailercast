name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings=0
      - name: jest
        run: npx jest --ci --verbose 2>&1 | tee /tmp/jest.log; test ${PIPESTATUS[0]} -eq 0
      - if: failure()
        run: |
          echo "=== JEST FAILURES ==="
          grep -E "FAIL|●" /tmp/jest.log | head -n 50 || true
          echo "--- full tail ---"
          tail -n 100 /tmp/jest.log || true
