name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm install
      - run: ls node_modules/expo-modules-core 2>&1 | head -20; echo "---jest-expo---"; ls node_modules/jest-expo 2>&1 | head -20; echo "---package---"; cat package.json | grep expo-modules-core
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings=0
      - run: npx jest --ci --verbose 2>&1 | tee /tmp/jest.log; test ${PIPESTATUS[0]} -eq 0
