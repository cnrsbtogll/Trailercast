name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm install
      - run: |
          echo "=== expo-modules-core check ==="
          ls node_modules/expo-modules-core 2>&1 | head -20 || echo "::error::expo-modules-core MISSING"
          echo "=== jest-expo setup check ==="
          head -n 5 node_modules/jest-expo/src/preset/setup.js 2>&1 | head -20 || echo "::error::jest-expo setup missing"
          echo "=== package grep ==="
          cat package.json | grep expo-modules-core || echo "::error::package.json missing expo-modules-core"
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings=0
      - name: jest
        run: |
          set +e
          npx jest --ci --verbose 2>&1 | tee /tmp/jest.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo "::error title=jest::$(head -n 40 /tmp/jest.log | tr '\n' ' ' | cut -c1-900)"
            cat /tmp/jest.log
          fi
          exit $EXIT
